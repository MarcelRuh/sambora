{% extends "base.html" %}
{% block title %}Fehler {{ code }} – {{ app_name }}{% endblock %}
{% block content %}
<div class="login-page">
  <div class="card u-error-card">
    <h1 class="error-code">{{ code }}</h1>
    <p class="u-error-lead">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Zur Startseite</a>
  </div>
</div>
{% endblock %}
